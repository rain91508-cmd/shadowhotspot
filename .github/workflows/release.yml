name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual, no obsolete 'tools' pkg)
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Locate sdkmanager (layout varies across runner images).
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Configure APK signing
        env:
          KS_FILE: ${{ github.workspace }}/android-app/release-keystore.jks
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'shadowhotspot' }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS || 'shadowhotspot' }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'shadowhotspot' }}
        run: |
          echo "KEYSTORE_FILE=${KS_FILE}" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${KS_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KS_ALIAS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KS_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Build release tarball (+ APK)
        env:
          BUILD_ANDROID: 1
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="$(find android-app/app/build/outputs -name '*.apk' | head -n1)"
          # Idempotent: drop any pre-existing release for this tag so re-runs
          # (and force-re-pushed tags) don't fail with
          # "a release with the same tag name already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo ">> Deleting existing release for $TAG"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            "releases/shadowhotspot-${TAG#v}.tar.xz" \
            "$APK" \
            --title "shadowhotspot $TAG" \
            --generate-notes
